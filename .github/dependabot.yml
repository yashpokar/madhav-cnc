version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore'
      prefix-development: 'chore'
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    # Major upgrades of these are migrations, not routine bumps (this Next.js has
    # breaking changes; Prisma and Better Auth touch the database and sessions).
    # Do them by hand, in their own PR, with the release notes read.
    ignore:
      - dependency-name: next
        update-types: ['version-update:semver-major']
      - dependency-name: eslint-config-next
        update-types: ['version-update:semver-major']
      - dependency-name: react
        update-types: ['version-update:semver-major']
      - dependency-name: react-dom
        update-types: ['version-update:semver-major']
      - dependency-name: prisma
        update-types: ['version-update:semver-major']
      - dependency-name: '@prisma/*'
        update-types: ['version-update:semver-major']
      - dependency-name: better-auth
        update-types: ['version-update:semver-major']
      - dependency-name: '@better-auth/*'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: 'ci'
    groups:
      actions:
        update-types: [minor, patch]
